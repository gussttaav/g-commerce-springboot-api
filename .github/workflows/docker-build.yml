name: Docker Build and Push

# Pull requests run the quality checks and the tests; pushes to main also build, publish and deploy the images
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

# A new commit on a pull request cancels the checks of the previous one (every push to main runs in full)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: ./mvnw -B checkstyle:check

      - name: Run PMD
        run: ./mvnw -B pmd:check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The document is generated by OpenApiSpecTest, which fails the test job if the committed copy is out of date
      - name: Lint the OpenAPI document
        run: npx --yes @redocly/cli@2.58.2 lint docs-site/public/openapi.json

  test:
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Generate test report
        if: always()
        run: ./mvnw -B surefire-report:report-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the database image
      - name: Build and push database image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.db
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/g-commerce-mysql:latest
      
      # Build and push the application image
      - name: Build and push application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/g-commerce-backend:latest

      # Update Docker Hub Description for Backend App
      - name: Update Backend Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/g-commerce-backend
          readme-filepath: ./DOCKER.md
          short-description: "Spring Boot E-commerce API - Backend Application"

      # Update Docker Hub Description for Database
      - name: Update Database Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/g-commerce-mysql
          readme-filepath: ./DOCKER_DB.md
          short-description: "MySQL Database for G-Commerce with pre-configured schema"