name: Docs Site

# Lints the published OpenAPI document and builds the documentation site, which fails on broken links.
# Vercel deploys the site from its own Git integration.
on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'redocly.yaml'
      - '.redocly.lint-ignore.yaml'
      - '.github/workflows/docs-site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'redocly.yaml'
      - '.redocly.lint-ignore.yaml'
      - '.github/workflows/docs-site.yml'

permissions:
  contents: read

# A new commit on a pull request cancels the checks of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # The document is generated by OpenApiSpecTest, which fails the Java tests if the committed copy is out of date
      - name: Lint the OpenAPI document
        working-directory: .
        run: npx --yes @redocly/cli@2.58.2 lint docs-site/public/openapi.json

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build
