spring:
  application:
    name: gestion-tienda
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost:3306}/shopping?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
        hibernate:
            connection:
                characterEncoding: utf8
                useUnicode: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:http}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Default admin user credentials
admin:
  default:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:Admin123!}

# JWT Configuration from environment variables
jwt:
  issuer: ${JWT_ISSUER:g-commerce-api}
  audience: ${JWT_AUDIENCE:g-commerce-api}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}

# OAuth2 Configuration
oauth2:
  key-encryption:
    # Required. The key that encrypts the RSA private keys stored in Redis is derived from this secret, which every
    # instance must share. Generate it with: openssl rand -base64 32
    secret: ${OAUTH2_KEY_ENCRYPTION_SECRET:}
  key-rotation:
    enabled: ${OAUTH2_KEY_ROTATION_ENABLED:true}
    cron: ${OAUTH2_KEY_ROTATION_CRON:0 0 2 1 * ?}

# CORS (Cross-Origin Resource Sharing) configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Requested-With

# Rate limiting configuration: each bucket allows bursts of `capacity` requests and refills `refill` requests
# per window. Anonymous requests and login attempts are limited per client IP address. Behind a reverse proxy, set
# server.forward-headers-strategy=native so the client address is taken from the proxy's X-Forwarded-For header.
rate-limit:
  window-minutes: 1
  unauthenticated:
    capacity: 10
    refill: 5
  user:
    capacity: 30
    refill: 20
  admin:
    capacity: 100
    refill: 50
  login:
    capacity: 5
    refill: 1

# Springdoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
  packages-to-scan: com.gplanet.commerce.api
  paths-to-match: /api/**

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        # Expose essential endpoints for monitoring
        include: health,info,metrics,prometheus
      base-path: /actuator
      cors:
        allowed-origins: "*"
        allowed-methods: GET,POST
        allowed-headers: "*"
        
  endpoint:
    # Health endpoint configuration
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,diskSpace

  # Health indicators configuration
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
      threshold: 100MB
    defaults:
      enabled: true

  # Application info
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      mode: full
    build:
      enabled: true

  # Metrics configuration
  metrics:
    enable:
      jvm: true
      system: true
      web: true
      jdbc: true
      hikaricp: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      application: ${spring.application.name}

---
# HTTP-only profile (default)
spring:
  config:
    activate:
      on-profile: http
server:
  port: 8080

---
# HTTPS profile
spring:
  config:
    activate:
      on-profile: https
server:
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: springboot