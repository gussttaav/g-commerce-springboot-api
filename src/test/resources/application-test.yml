spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cache:
    type: redis

# Test-specific Redis configuration
redis:
  embedded: true

jwt:
  issuer: test-g-commerce-api
  access-expiration-ms: 3600000
  refresh-expiration-ms: 86400000

management:
  health:
    redis:
      enabled: false

# Disable key rotation in tests
oauth2:
  key-encryption:
    secret: test-secret-for-the-private-key-encryption
  key-rotation:
    enabled: false

# Rate-limit buckets are kept for the lifetime of the application context, which test classes share, and all
# MockMvc requests come from the same IP address, so the limits are high enough that no test depends on the
# requests made by earlier tests
rate-limit:
  unauthenticated:
    capacity: 10000
    refill: 10000
  user:
    capacity: 10000
    refill: 10000
  admin:
    capacity: 10000
    refill: 10000
  login:
    capacity: 10000
    refill: 10000

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Requested-With
  test-origin: http://localhost:3000